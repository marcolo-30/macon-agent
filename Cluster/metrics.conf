{
  "qos": {
    "query": "qos_composite{service=~\"traffic-processor.*\"}",
    "type": "scalar"
  },
  "qos_latency_score": {
    "query": "qos_latency_score{service=~\"traffic-processor.*\"}",
    "type": "scalar"
  },
  "qos_cpu_percent": {
    "query": "qos_cpu_percent{service=~\"traffic-processor.*\"}",
    "type": "scalar"
  },
  "qos_avg_proc_time": {
    "query": "qos_avg_proc_time{service=~\"traffic-processor.*\"}",
    "type": "scalar"
  },
  "nodes_cpu": {
    "query": "100 * sum by (cluster, k8s_node_name) (rate(system_cpu_time_seconds_total{job=\"otel-collectors\", state!=\"idle\"}[1m])) / count by (cluster, k8s_node_name) (system_cpu_time_seconds_total{job=\"otel-collectors\", state=\"idle\"})",
    "type": "per_node",
    "node_label": "k8s_node_name"
  }
}
